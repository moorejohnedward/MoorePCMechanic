# Build check: runs on every push so compile errors are caught on GitHub,
# not on John's PC. Nothing is released here.
name: Build check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read   # this job only reads the code; only the Release job can change the repo

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build MoorePCMechanic/MoorePCMechanic.csproj -c Release

      - name: Build for ARM64 (Snapdragon / Windows on ARM)
        run: dotnet build MoorePCMechanic/MoorePCMechanic.csproj -c Release -r win-arm64
