# Smoke test: runs the driver and benchmark code on a real Windows machine (GitHub's server)
# and prints the results. Started by hand from the Actions tab or by Claude.
name: Smoke test

on:
  workflow_dispatch:
  push:
    branches: [ 'v*-dev' ]

permissions:
  contents: read   # this job only reads the code; only the Release job can change the repo

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Run smoke test
        run: dotnet run --project tests/Smoke/Smoke.csproj -c Release
